# Photo sets are grouped by country. As new trips happen, add more entries
# to an existing country rather than creating a new set.
#
# Each photo has:
#   file:    path relative to /assets/images/photos/
#            (nested as <country>/<city-year>/<filename> so future trips to
#            the same country can drop in without renumbering)
#   caption: shown in the lightbox on click; free-form
#            (city, area, site, landmark, whatever fits)

