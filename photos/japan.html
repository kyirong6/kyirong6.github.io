---
layout: page
title: Japan
permalink: /photos/japan/
set: japan
---

{% assign set = site.data.photos | where: "slug", page.set | first %}
<div class="photo-gallery">
  <div class="photo-grid">
    {% for photo in set.photos %}
    <a href="/assets/images/photos/{{ photo.file }}" class="photo-item" data-caption="{{ photo.caption }}">
      <img src="/assets/images/photos/{{ photo.file }}" alt="{{ photo.caption | default: set.title }}">
    </a>
    {% endfor %}
  </div>
</div>
