---
layout: page
title: Archive
permalink: /photos/archive/
---

<div class="photo-gallery">
  <div class="photo-grid">
    {% for set in site.data.photos %}
      {% for photo in set.photos %}
    <a href="/assets/images/photos/{{ photo.file }}" class="photo-item" data-caption="{{ photo.caption | xml_escape }}">
      <img src="/assets/images/photos/{{ photo.file }}" alt="{{ photo.caption | default: set.title | xml_escape }}">
    </a>
      {% endfor %}
    {% endfor %}
  </div>
</div>
