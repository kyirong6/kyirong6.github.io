{% assign set = site.data.photos | where: "slug", page.set | first %}
<div class="photo-gallery">
  <div class="photo-grid">
    {% for photo in set.photos %}
    <a href="/assets/images/photos/{{ set.slug }}/{{ photo }}" class="photo-item">
      <img src="/assets/images/photos/{{ set.slug }}/{{ photo }}" alt="{{ set.title }}">
    </a>
    {% endfor %}
  </div>
</div>
